[workspace]
members = [
    "engine",
    "editor",
    "runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.79"
edition = "2024"

[workspace.dependencies]
glam = "0.33.2"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = "0.4.45"
wgpu = { version = "30.0.1", features = ["glsl"] }
raw-window-handle = "0.6.2"
winit = { version = "0.30.13", features = ["android-native-activity"] }
bevy_ecs = "0.19.0"
rapier3d-f64 = { version = "0.36", features = ["parallel"] }
mimalloc = { version = "*", features = ["secure"] }
dirs = "6.0.0"
smallvec = "1.16.1"
netcorehost = "0.22.0"
MathUtils = "1.0.1"
imgui = "0.12.0"
imgui-winit-support = "0.13.0"
image = "0.25.10"
meshoptimizer-rs = "0.2.7"
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
pollster = "0.3"

[profile.dev]
opt-level = 3
debug = false
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
panic = "abort"
strip = true
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
rpath = false

[profile.release.package."*"]
opt-level = 3
